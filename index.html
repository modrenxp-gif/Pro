<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PRO KING STORE</title>
  <meta name="description" content="PRO KING STORE - متجر منتجات متنوعة">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="assets/pro-logo.png" alt="PRO"><span>PRO KING STORE</span></div>
  <button id="cartBtn" class="cart">🛒 السلة <b id="cartCount">0</b></button>
</header>

<section class="hero">
  <div>
    <span class="eyebrow">PRO KING STORE</span>
    <h1>كل اللي تحتاجه<br><strong>بمكان واحد</strong></h1>
    <p>منتجات متنوعة، عروض مستمرة، وطلب سهل مع الدفع عند الاستلام.</p>
    <a href="#products" class="cta">تسوق الآن</a>
  </div>
  <img src="assets/pro-logo.png" alt="PRO KING" class="hero-logo">
</section>

<nav class="categories">
  <button class="active" data-cat="all">الكل</button>
  <button data-cat="electronics">إلكترونيات</button>
  <button data-cat="fashion">ملابس</button>
  <button data-cat="home">منزل</button>
  <button data-cat="accessories">إكسسوارات</button>
</nav>

<main id="products">
  <div class="section-head">
    <h2>المنتجات</h2>
    <input id="search" type="search" placeholder="ابحث عن منتج...">
  </div>
  <div id="grid" class="grid"></div>
</main>

<div id="cartPanel" class="drawer">
  <div class="drawer-head"><h2>سلة المشتريات</h2><button id="closeCart">✕</button></div>
  <div id="cartItems"></div>
  <div class="total">المجموع: <strong id="total">0</strong> د.ع</div>
  <button id="checkoutBtn" class="cta full">إتمام الطلب</button>
</div>
<div id="overlay" class="overlay"></div>

<div id="checkout" class="modal">
  <div class="modal-card">
    <button id="closeCheckout" class="x">✕</button>
    <h2>بيانات الطلب</h2>
    <p>الدفع عند الاستلام</p>
    <form id="orderForm">
      <input required name="name" placeholder="الاسم الكامل">
      <input required name="phone" inputmode="tel" placeholder="رقم الهاتف">
      <select required name="province">
        <option value="">اختر المحافظة</option>
        <option>بغداد</option><option>البصرة</option><option>نينوى</option>
        <option>أربيل</option><option>النجف</option><option>كربلاء</option>
        <option>الأنبار</option><option>ديالى</option><option>بابل</option>
        <option>واسط</option><option>صلاح الدين</option><option>كركوك</option>
        <option>ذي قار</option><option>ميسان</option><option>المثنى</option><option>الديوانية</option><option>دهوك</option><option>السليمانية</option>
      </select>
      <textarea required name="address" placeholder="العنوان بالتفصيل"></textarea>
      <button class="cta full" type="submit">تأكيد الطلب</button>
    </form>
    <div id="success" class="success" hidden>تم تسجيل طلبك بنجاح ✅</div>
  </div>
</div>

<footer>© 2026 PRO KING STORE — جميع الحقوق محفوظة</footer>
<script src="script.js"></script>
</body>
</html>
